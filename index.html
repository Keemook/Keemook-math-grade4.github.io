<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Arcade ป.4</title>
  <style>
    /* Animated Cute Background */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Kanit', 'Sarabun', sans-serif;
      min-height: 100vh;
      background: linear-gradient(-45deg, #a88beb, #f8ceec, #b5eedc, #a8d8ea);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating Bubbles in Background */
    .bg-bubbles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      margin: 0;
      padding: 0;
    }

    .bubble {
      position: absolute;
      list-style: none;
      display: block;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.45);
      bottom: -100px;
      border-radius: 50%;
      animation: floatUp 15s infinite linear;
    }

    .bubble:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-delay: 0s; }
    .bubble:nth-child(2) { left: 20%; width: 25px; height: 25px; animation-delay: 2s; animation-duration: 12s; }
    .bubble:nth-child(3) { left: 35%; width: 50px; height: 50px; animation-delay: 4s; }
    .bubble:nth-child(4) { left: 60%; width: 30px; height: 30px; animation-duration: 18s; background: rgba(255, 230, 240, 0.5); }
    .bubble:nth-child(5) { left: 75%; width: 45px; height: 45px; animation-delay: 0s; }
    .bubble:nth-child(6) { left: 88%; width: 25px; height: 25px; animation-delay: 3s; background: rgba(230, 240, 255, 0.6); }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 50%; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 40%; }
    }

    /* Game Container Card */
    .game-card {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 620px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    /* Header Bar */
    .header-bar {
      background: linear-gradient(90deg, #5c6bc0, #7e57c2);
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-stats {
      display: flex;
      gap: 10px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      backdrop-filter: blur(4px);
    }

    /* Status Bar */
    .status-bar {
      background: #f1f5f9;
      margin: 16px 20px 0 20px;
      padding: 10px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #334155;
      font-weight: 600;
    }

    /* Question Box */
    .question-box {
      margin: 16px 20px;
      padding: 28px 20px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      text-align: center;
    }

    .question-text {
      font-size: 1.35rem;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 16px;
    }

    .monster-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      padding: 8px 18px;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      color: #e11d48;
      font-weight: bold;
    }

    .monster-icon {
      font-size: 1.6rem;
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 20px 24px 20px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .option-btn:hover {
      border-color: #6366f1;
      background: #f0f3ff;
      transform: translateY(-2px);
    }

    .option-btn:active {
      transform: translateY(0);
    }

    /* Game Over View */
    .game-over-box {
      padding: 40px 20px;
      text-align: center;
      display: none;
    }

    .restart-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 16px;
      transition: background 0.2s;
    }

    .restart-btn:hover {
      background: #059669;
    }
  </style>
</head>
<body>

  <!-- Floating Background Elements -->
  <ul class="bg-bubbles">
    <li class="bubble"></li>
    <li class="bubble"></li>
    <li class="bubble"></li>
    <li class="bubble"></li>
    <li class="bubble"></li>
    <li class="bubble"></li>
  </ul>

  <!-- Main Game Card -->
  <div class="game-card">
    <div class="header-bar">
      <div class="header-title">🕹️ Math Arcade ป.4</div>
      <div class="header-stats">
        <div class="badge">⭐ คะแนนสะสม: <span id="total-score">14</span></div>
        <button class="badge" onclick="resetGame()" style="border:none; cursor:pointer;">🏠 หน้าหลัก</button>
      </div>
    </div>

    <!-- Active Game View -->
    <div id="game-view">
      <div class="status-bar">
        <div>⚔️ ตะลุยด่านคิดเลขเร็ว</div>
        <div>ข้อที่ <span id="current-q">1</span> / 5</div>
        <div>คะแนน: <span id="current-score">0</span></div>
      </div>

      <div class="question-box">
        <div class="question-text" id="question-text">คำนวณผลบวก: ... = ?</div>
        <div class="monster-container">
          <span class="monster-icon">👾</span>
          <span id="monster-text">ปีศาจดาวตก (HP 100%)</span>
        </div>
      </div>

      <div class="options-grid" id="options-container">
        <!-- ปุ่มคำตอบจะถูกสร้างสุ่มโดย JS -->
      </div>
    </div>

    <!-- Game Over Screen -->
    <div class="game-over-box" id="game-over-view">
      <h2>🎉 สรุปผลการเล่น!</h2>
      <p style="font-size: 1.25rem;">คุณทำได้ <span id="final-score" style="color:#6366f1; font-weight:bold;">0</span> / 5 คะแนน</p>
      <button class="restart-btn" onclick="resetGame()">🔄 เล่นใหม่อีกครั้ง (สุ่มโจทย์ใหม่ไม่ซ้ำ)</button>
    </div>
  </div>

  <script>
    let currentQuestionIndex = 0;
    let score = 0;
    let totalScore = 14;
    let questionsList = [];

    // ตัวแปรสำหรับบันทึกโจทย์ที่เคยออกไปแล้ว ป้องกันการออกซ้ำทุกเกมย่อย
    const usedQuestions = new Set();

    const monsterNames = ["ปีศาจดาวตก", "ปีศาจสายฟ้า", "ปีศาจวายุ", "ปีศาจไฟเยอร์", "ปีศาจคริสตัล"];

    function generateRandomQuestions(count = 5) {
      const questions = [];
      let attempts = 0; // ตัวนับกันวนลูปไม่จบ

      while (questions.length < count && attempts < 1000) {
        attempts++;
        const isAddition = Math.random() > 0.4;
        let num1, num2, correctAnswer, qText, questionKey;

        if (isAddition) {
          num1 = Math.floor(Math.random() * 45 + 10) * 10000;
          num2 = Math.floor(Math.random() * 25 + 5) * 5000;
          correctAnswer = num1 + num2;
          questionKey = `ADD_${num1}_${num2}`;
          qText = `คำนวณผลบวก: ${num1.toLocaleString()} + ${num2.toLocaleString()} = ?`;
        } else {
          num1 = Math.floor(Math.random() * 40 + 20) * 10000;
          num2 = Math.floor(Math.random() * 15 + 5) * 10000;
          if (num1 < num2) [num1, num2] = [num2, num1];
          correctAnswer = num1 - num2;
          questionKey = `SUB_${num1}_${num2}`;
          qText = `คำนวณผลลบ: ${num1.toLocaleString()} - ${num2.toLocaleString()} = ?`;
        }

        // เช็คว่าโจทย์ข้อนี้เคยใช้ไปแล้วหรือยัง ถ้าเคยใช้แล้วให้สุ่มใหม่
        if (usedQuestions.has(questionKey)) {
          continue;
        }

        // บันทึกว่าโจทย์นี้ถูกใช้งานแล้ว
        usedQuestions.add(questionKey);

        // สุ่มตัวเลือกหลอก 3 ตัวที่ไม่ซ้ำกับเฉลย
        const choicesSet = new Set([correctAnswer]);
        const variations = [10000, -10000, 20000, -20000, 5000, -5000, 1000, -1000];

        while (choicesSet.size < 4) {
          const offset = variations[Math.floor(Math.random() * variations.length)];
          const wrongChoice = correctAnswer + offset;
          if (wrongChoice > 0 && wrongChoice !== correctAnswer) {
            choicesSet.add(wrongChoice);
          }
        }

        const options = Array.from(choicesSet).sort(() => Math.random() - 0.5);

        questions.push({
          question: qText,
          correctAnswer: correctAnswer,
          options: options,
          monster: `${monsterNames[questions.length % monsterNames.length]} (HP 100%)`
        });
      }

      return questions;
    }

    function loadQuestion() {
      if (currentQuestionIndex >= questionsList.length) {
        showGameOver();
        return;
      }

      const q = questionsList[currentQuestionIndex];
      document.getElementById('current-q').innerText = currentQuestionIndex + 1;
      document.getElementById('question-text').innerText = q.question;
      document.getElementById('monster-text').innerText = q.monster;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach(optionVal => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optionVal.toLocaleString();
        btn.onclick = () => checkAnswer(optionVal, q.correctAnswer);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct) {
      if (selected === correct) {
        score++;
        totalScore++;
        document.getElementById('current-score').innerText = score;
        document.getElementById('total-score').innerText = totalScore;
      }
      currentQuestionIndex++;
      loadQuestion();
    }

    function showGameOver() {
      document.getElementById('game-view').style.display = 'none';
      document.getElementById('game-over-view').style.display = 'block';
      document.getElementById('final-score').innerText = score;
    }

    function resetGame() {
      currentQuestionIndex = 0;
      score = 0;
      document.getElementById('current-score').innerText = score;
      document.getElementById('game-view').style.display = 'block';
      document.getElementById('game-over-view').style.display = 'none';
      
      // สุ่มชุดโจทย์ใหม่ที่การันตีว่าไม่ซ้ำกับเกมย่อยที่ผ่านๆ มา
      questionsList = generateRandomQuestions(5);
      loadQuestion();
    }

    // เริ่มเกมครั้งแรก
    resetGame();
  </script>
</body>
</html>
